<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestore Metodi JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Laboratorio JS: Array e Stringhe</h1>
        
        <section class="inserimento">
            <input type="text" id="input-parola" placeholder="Scrivi una parola...">
            <button id="btn-aggiungi">Aggiungi all'Array</button>
        </section>

        <section class="pulsantiera">
            <button class="btn-azione" data-azione="maiuscolo">Converti in Maiuscolo</button>
            <button class="btn-azione" data-azione="minuscolo">Converti in Minuscolo</button>
            <button class="btn-azione" data-azione="lunghezza">Mostra numero lettere</button>
        </section>

        <div id="schermo">
           Qui comparirà il risultato...
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
